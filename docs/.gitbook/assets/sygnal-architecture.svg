<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 772" width="1000" height="772" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Architecture of a Sygnal network</title>
  <desc id="d">Edge platforms connect through the Sygnal Edge Adapter. Handoffs travel peer to peer between adapters. Shared network enablement services see coordination metadata only. Clinical records move over the records layer, never through the network services. Governance configures the network. This is one Sygnal network; a health system can run several, and networks can be linked into a network of networks.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="772" fill="#ffffff"/>
  <!-- Network banner -->
  <rect x="24" y="12" width="952" height="30" rx="6" fill="#0f766e"/>
  <text x="40" y="32" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="1.2">ONE SYGNAL NETWORK</text>
  <text x="226" y="32" font-size="12.5" fill="#e6fffa">identified by its networkId · a health system can run several networks, and networks can link into a network of networks</text>
  <g transform="translate(0,42)">


  <!-- Edge platforms -->
  <g font-size="13" fill="#1e293b" text-anchor="middle">
    <rect x="24"  y="54" width="176" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="112" y="82" font-weight="600">Community health</text><text x="112" y="100">worker apps</text>
    <rect x="218" y="54" width="176" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="306" y="82" font-weight="600">Clinic &amp; primary</text><text x="306" y="100">care EMRs</text>
    <rect x="412" y="54" width="176" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="500" y="82" font-weight="600">Hospital</text><text x="500" y="100">management systems</text>
    <rect x="606" y="54" width="176" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="694" y="82" font-weight="600">Campaign &amp;</text><text x="694" y="100">programme platforms</text>
    <rect x="800" y="54" width="176" height="64" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="888" y="82" font-weight="600">Labs, pharmacies,</text><text x="888" y="100">other services</text>
  </g>

  <!-- Adapters -->
  <g fill="#1d4ed8">
    <rect x="24"  y="180" width="176" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="218" y="180" width="176" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="412" y="180" width="176" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="606" y="180" width="176" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="800" y="180" width="176" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <text x="112" y="207">Edge Adapter</text><text x="306" y="207">Edge Adapter</text><text x="500" y="207">Edge Adapter</text><text x="694" y="207">Edge Adapter</text><text x="888" y="207">Edge Adapter</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="112" y1="118" x2="112" y2="180"/><line x1="306" y1="118" x2="306" y2="180"/><line x1="500" y1="118" x2="500" y2="180"/><line x1="694" y1="118" x2="694" y2="180"/><line x1="888" y1="118" x2="888" y2="180"/>
  </g>

  <!-- Peer-to-peer plane -->
  <rect x="24" y="240" width="952" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="500" y="332" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2" text-anchor="middle">PEER-TO-PEER PLANE — handoffs travel directly between participants</text>
  <g stroke="#3b4a6b" stroke-width="2" fill="none">
    <path d="M112 224 C112 300, 306 300, 306 224" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <path d="M306 224 C306 330, 694 330, 694 224" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <path d="M500 224 C500 310, 888 310, 888 224" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="500" y="358" font-weight="600">Signed, asynchronous handoffs: Beckn transitions (discover · select · init · confirm · status · update · cancel)</text>
    <text x="500" y="376">plus Sygnal coordination messages between counter-parties — carrying only the context the two parties need</text>
  </g>

  <!-- Records layer -->
  <rect x="24" y="400" width="952" height="30" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="500" y="420" font-size="12" fill="#5b21b6" text-anchor="middle">RECORDS LAYER / HEALTH INFORMATION EXCHANGE — clinical records move edge to edge here, with consent; never through the control plane</text>

  <!-- Control plane services -->
  <rect x="24" y="470" width="952" height="160" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <g font-size="13" fill="#064e3b" text-anchor="middle">
    <rect x="40"  y="486" width="172" height="78" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="126" y="512" font-weight="700">Network Registry</text><text x="126" y="532" font-size="11.5">who's who: identities,</text><text x="126" y="547" font-size="11.5">keys, addresses, roles</text>
    <rect x="226" y="486" width="172" height="78" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="312" y="512" font-weight="700">Discovery Service</text><text x="312" y="532" font-size="11.5">find services and</text><text x="312" y="547" font-size="11.5">providers to hand off to</text>
    <rect x="412" y="486" width="172" height="78" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="498" y="512" font-weight="700">Policy Manager</text><text x="498" y="532" font-size="11.5">signed coordination</text><text x="498" y="547" font-size="11.5">policies, SLAs, reporting</text>
    <rect x="598" y="486" width="172" height="78" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="684" y="506" font-weight="700">Deviation &amp;</text><text x="684" y="522" font-weight="700">Escalation Platform</text><text x="684" y="540" font-size="11.5">flags, dispositions,</text><text x="684" y="555" font-size="11.5">escalation ladders</text>
    <rect x="784" y="486" width="176" height="78" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="872" y="512" font-weight="700">Network Intelligence</text><text x="872" y="532" font-size="11.5">observation, dashboards,</text><text x="872" y="547" font-size="11.5">advisory signals</text>
  </g>
  <g font-size="11.5" fill="#065f46" text-anchor="middle">
    <text x="500" y="592">Inbound: registry look-ups · discover · deviation/flag · event/report · network telemetry (all metadata)</text>
    <text x="500" y="610">Outbound: policy/update · signal/emit (advisory — the centre observes and signals, never decides)</text>
  </g>
  <g stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="60" y1="226" x2="60" y2="484" marker-start="url(#ahg)" marker-end="url(#ahg)"/>
    <line x1="940" y1="226" x2="940" y2="484" marker-start="url(#ahg)" marker-end="url(#ahg)"/>
  </g>

  <!-- Governance -->
  <rect x="24" y="660" width="952" height="50" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="500" y="690" font-size="13" fill="#78350f" text-anchor="middle">Sets the rules: coordination and reporting policies · participation and certification · protocol stewardship — configures the network, never decides care</text>
  <line x1="500" y1="660" x2="500" y2="632" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Layer labels -->
  <g font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
    <text x="24" y="40">EDGE PLATFORMS — where care happens and clinical decisions are made</text>
    <text x="24" y="168">EDGE ADAPTER — one per platform; signs, routes, enforces policy at the edge</text>
    <text x="24" y="458">CONTROL PLANE — network enablement services · coordination metadata only</text>
    <text x="24" y="648">GOVERNANCE</text>
  </g>
  </g>
</svg>
